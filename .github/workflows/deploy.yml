# Avaldab lehe automaatselt GitHub Pagesis iga kord, kui main-harusse lisatakse muudatus.
name: Avalda GitHub Pagesis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Laadi kood
        uses: actions/checkout@v4

      - name: Seadista Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Seadista Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Paigalda sõltuvused
        run: npm ci

      - name: Ehita leht
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Laadi ehitatud leht üles
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Avalda
        id: deployment
        uses: actions/deploy-pages@v4
